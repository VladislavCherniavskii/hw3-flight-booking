services:
  flight-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flightdb
    ports: ["5433:5432"]
    volumes: [flight_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flightdb"]
      interval: 3s
      timeout: 3s
      retries: 10

  booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookingdb
    ports: ["5434:5432"]
    volumes: [booking_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookingdb"]
      interval: 3s
      timeout: 3s
      retries: 10

  flyway-flight:
    image: flyway/flyway:10-alpine
    platform: linux/amd64
    command: -url=jdbc:postgresql://flight-db:5432/flightdb -user=postgres -password=postgres -connectRetries=60 migrate
    volumes: [./flight-service/migrations:/flyway/sql]
    depends_on:
      flight-db: { condition: service_healthy }

  flyway-booking:
    image: flyway/flyway:10-alpine
    platform: linux/amd64
    command: -url=jdbc:postgresql://booking-db:5432/bookingdb -user=postgres -password=postgres -connectRetries=60 migrate
    volumes: [./booking-service/migrations:/flyway/sql]
    depends_on:
      booking-db: { condition: service_healthy }

  redis-master:
    image: redis:7-alpine
    command: redis-server --port 6379 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis-replica-1:
    image: redis:7-alpine
    command: redis-server --port 6379 --replicaof redis-master 6379 --appendonly yes
    depends_on:
      redis-master: { condition: service_healthy }

  redis-replica-2:
    image: redis:7-alpine
    command: redis-server --port 6379 --replicaof redis-master 6379 --appendonly yes
    depends_on:
      redis-master: { condition: service_healthy }

  redis-sentinel-1:
    image: redis:7-alpine
    command: redis-server /etc/redis/sentinel.conf --sentinel
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    depends_on:
      redis-master: { condition: service_healthy }
      redis-replica-1: { condition: service_started }
      redis-replica-2: { condition: service_started }

  redis-sentinel-2:
    image: redis:7-alpine
    command: redis-server /etc/redis/sentinel.conf --sentinel
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    depends_on:
      redis-master: { condition: service_healthy }
      redis-replica-1: { condition: service_started }
      redis-replica-2: { condition: service_started }

  redis-sentinel-3:
    image: redis:7-alpine
    command: redis-server /etc/redis/sentinel.conf --sentinel
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    depends_on:
      redis-master: { condition: service_healthy }
      redis-replica-1: { condition: service_started }
      redis-replica-2: { condition: service_started }

  flight-service:
    build:
      context: .
      dockerfile: flight-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@flight-db:5432/flightdb
      JWT_SECRET: shared-secret
      GRPC_PORT: 50051
      CACHE_TTL: 300
    ports: ["50051:50051"]
    depends_on:
      flyway-flight: { condition: service_completed_successfully }
      redis-sentinel-1: { condition: service_started }

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@booking-db:5432/bookingdb
      FLIGHT_GRPC_TARGET: flight-service:50051
      JWT_SECRET: shared-secret
      GRPC_TIMEOUT: 5.0
      CB_FAILURE_THRESHOLD: 5
      CB_RECOVERY_TIMEOUT: 15
      RETRY_MAX_ATTEMPTS: 3
      RETRY_BASE_DELAY: 0.1
    ports: ["8002:8000"]
    depends_on:
      flyway-booking: { condition: service_completed_successfully }
      flight-service: { condition: service_started }

volumes:
  flight_pg:
  booking_pg:
